name: Build Android Debug APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Accept Android SDK Licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Locate or Extract Android Project
        id: project_setup
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Repository root ==="
          ls -la
          PROJECT_ROOT=""

          # Prefer a real project already checked into the repository.
          if [[ -f settings.gradle.kts || -f settings.gradle ]]; then
            PROJECT_ROOT="."
          else
            mkdir -p extracted_project
            # Handle spaces, parentheses, ampersands, and other special characters safely.
            mapfile -d '' ZIP_FILES < <(find . -maxdepth 2 -type f -name '*.zip' ! -path './.git/*' -print0)
            if (( ${#ZIP_FILES[@]} == 0 )); then
              echo "::error::No Gradle project or ZIP archive found in repository."
              exit 1
            fi

            echo "Found ${#ZIP_FILES[@]} archive(s). Searching archive contents safely..."
            SELECTED_ZIP=""
            for z in "${ZIP_FILES[@]}"; do
              echo "Checking archive: $z"
              if unzip -Z1 "$z" 2>/dev/null | grep -Eq '(^|/)settings\.gradle(\.kts)?$'; then
                SELECTED_ZIP="$z"
                echo "Selected archive containing Gradle settings: $SELECTED_ZIP"
                break
              fi
            done

            # If the uploaded ZIP is a builder hub containing a project ZIP inside it,
            # extract the hub and inspect its nested ZIPs too.
            if [[ -n "$SELECTED_ZIP" ]]; then
              unzip -q "$SELECTED_ZIP" -d extracted_project
            else
              SELECTED_ZIP="${ZIP_FILES[0]}"
              echo "No direct Gradle settings in outer archives; extracting hub: $SELECTED_ZIP"
              unzip -q "$SELECTED_ZIP" -d extracted_project
              while IFS= read -r -d '' nested; do
                echo "Checking nested archive: $nested"
                if unzip -Z1 "$nested" 2>/dev/null | grep -Eq '(^|/)settings\.gradle(\.kts)?$'; then
                  mkdir -p extracted_android_project
                  unzip -q "$nested" -d extracted_android_project
                  PROJECT_ROOT="extracted_android_project"
                  break
                fi
              done < <(find extracted_project -type f -name '*.zip' -print0)
            fi

            # If a direct archive was selected, find the actual project folder inside it.
            if [[ -z "$PROJECT_ROOT" ]]; then
              SETTINGS_FILE=$(find extracted_project -type f \( -name settings.gradle.kts -o -name settings.gradle \) -not -path '*/.git/*' -print -quit)
              if [[ -n "$SETTINGS_FILE" ]]; then
                PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"
              fi
            fi
          fi

          if [[ -z "$PROJECT_ROOT" ]] || [[ ! -f "$PROJECT_ROOT/settings.gradle.kts" && ! -f "$PROJECT_ROOT/settings.gradle" ]]; then
            echo "::error::Could not find settings.gradle(.kts) in the uploaded archive or its nested project ZIPs."
            echo "Extracted files for diagnosis:"
            find extracted_project -maxdepth 4 -type f | head -100 || true
            exit 1
          fi

          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"
          echo "Resolved Android project root: $PROJECT_ROOT"
          ls -la "$PROJECT_ROOT"

      - name: Verify and Fix Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_ROOT="${{ steps.project_setup.outputs.project_root }}"
          cd "$PROJECT_ROOT"
          mkdir -p gradle/wrapper
          WRAPPER_JAR="gradle/wrapper/gradle-wrapper.jar"
          EXPECTED_SHA256="2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046"
          NEED_DOWNLOAD=false
          if [[ ! -s "$WRAPPER_JAR" ]]; then
            NEED_DOWNLOAD=true
          else
            CURRENT_SHA256=$(sha256sum "$WRAPPER_JAR" | awk '{print $1}')
            [[ "$CURRENT_SHA256" == "$EXPECTED_SHA256" ]] || NEED_DOWNLOAD=true
          fi
          if [[ "$NEED_DOWNLOAD" == true ]]; then
            curl -fsSL "https://raw.githubusercontent.com/gradle/gradle/v8.10.2/gradle/wrapper/gradle-wrapper.jar" -o "$WRAPPER_JAR"
            ACTUAL_SHA256=$(sha256sum "$WRAPPER_JAR" | awk '{print $1}')
            if [[ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]]; then
              echo "::error::Gradle wrapper JAR checksum verification failed."
              exit 1
            fi
          fi
          [[ -f gradlew ]] || { echo "::error::gradlew missing in $PROJECT_ROOT"; exit 1; }
          chmod +x gradlew

      - name: Validate Project Configuration
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_ROOT="${{ steps.project_setup.outputs.project_root }}"
          cd "$PROJECT_ROOT"
          [[ -f app/build.gradle.kts || -f app/build.gradle ]] || { echo "::error::app/build.gradle(.kts) missing"; exit 1; }
          [[ -f app/src/main/AndroidManifest.xml ]] || { echo "::error::AndroidManifest.xml missing"; exit 1; }
          echo "Android project structure verified."

      - name: Run Unit Tests
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project_setup.outputs.project_root }}"
          ./gradlew test --stacktrace --no-daemon

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project_setup.outputs.project_root }}"
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK Output
        id: verify_apk
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_ROOT="${{ steps.project_setup.outputs.project_root }}"
          APK_PATH="$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$APK_PATH" ]]; then
            echo "::error::Non-empty app-debug.apk not found at expected path."
            find "$PROJECT_ROOT/app/build/outputs" -type f 2>/dev/null || true
            exit 1
          fi
          ls -lh "$APK_PATH"
          sha256sum "$APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-assistant-debug-apk
          path: ${{ steps.verify_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
