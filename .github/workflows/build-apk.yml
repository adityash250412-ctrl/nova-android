
name: Build Android Debug APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Locate Android Project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ROOT=""
          if [[ -f settings.gradle.kts || -f settings.gradle ]]; then
            ROOT="."
          else
            mkdir -p hub android_project

            mapfile -d '' zips < <(
              find . -maxdepth 2 -type f -name '*.zip' \
                ! -path './.git/*' -print0
            )

            if [[ ${#zips[@]} -eq 0 ]]; then
              echo "::error::No ZIP found in repository."
              exit 1
            fi

            HUB="${zips[0]}"
            echo "Outer ZIP: $HUB"
            unzip -oq "$HUB" -d hub

            INNER="hub/public/downloads/nova-android-project-ready.zip"

            if [[ ! -f "$INNER" ]]; then
              echo "::error::Expected Android ZIP not found: $INNER"
              find hub -type f -name '*.zip' -print
              exit 1
            fi

            echo "Selected Android ZIP: $INNER"
            unzip -oq "$INNER" -d android_project

            if [[ -f android_project/settings.gradle.kts ]]; then
              ROOT="android_project"
            elif [[ -f android_project/settings.gradle ]]; then
              ROOT="android_project"
            else
              echo "::error::Selected ZIP has no Gradle settings file."
              find android_project -maxdepth 3 -type f | head -100
              exit 1
            fi
          fi

          if [[ ! -f "$ROOT/app/build.gradle.kts" && \
                ! -f "$ROOT/app/build.gradle" ]]; then
            echo "::error::Android app Gradle file is missing."
            exit 1
          fi

          if [[ ! -f "$ROOT/gradlew" ]]; then
            echo "::error::gradlew is missing."
            exit 1
          fi

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Android project selected: $ROOT"

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.root }}"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.project.outputs.root }}"
          FILE="$ROOT/app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -s "$FILE" ]]; then
            echo "::error::APK missing or empty."
            find "$ROOT/app/build/outputs" -type f || true
            exit 1
          fi

          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          ls -lh "$FILE"
          sha256sum "$FILE"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-assistant-debug-apk
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error
          retention-days: 14
          
