name: Build Android Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Locate or Extract Android Project
        id: project_setup
        run: |
          set -euo pipefail

          echo "=== Inspecting workspace structure ==="
          ls -la

          PROJECT_DIR="."

          # If settings.gradle or settings.gradle.kts is not in root, look for project ZIPs
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo "No settings.gradle(.kts) found in repository root. Searching for project ZIP archives..."
            
            ZIP_FILES=$(find . -maxdepth 2 -type f -name "*.zip" ! -path "*/.*")
            if [ -z "$ZIP_FILES" ]; then
              echo "::error::Neither settings.gradle(.kts) nor any project .zip file was found in the repository root!"
              exit 1
            fi

            echo "Found ZIP file(s):"
            echo "$ZIP_FILES"

            SELECTED_ZIP=""
            for z in $ZIP_FILES; do
              if unzip -l "$z" | grep -q "settings.gradle"; then
                SELECTED_ZIP="$z"
                echo "Selected project archive: $SELECTED_ZIP"
                break
              fi
            done

            if [ -z "$SELECTED_ZIP" ]; then
              SELECTED_ZIP=$(echo "$ZIP_FILES" | head -n 1)
              echo "Fallback to first archive: $SELECTED_ZIP"
            fi

            mkdir -p extracted_project
            unzip -q "$SELECTED_ZIP" -d extracted_project

            NESTED_ZIPS=$(find extracted_project -type f -name "*.zip")
            if [ -n "$NESTED_ZIPS" ]; then
              for nz in $NESTED_ZIPS; do
                if unzip -l "$nz" | grep -q "settings.gradle"; then
                  echo "Found nested project archive: $nz"
                  mkdir -p extracted_nested
                  unzip -q "$nz" -d extracted_nested
                  PROJECT_DIR="extracted_nested"
                  break
                fi
              done
            fi

            if [ "$PROJECT_DIR" = "." ]; then
              PROJECT_DIR="extracted_project"
            fi
          fi

          ACTUAL_DIR=$(find "$PROJECT_DIR" -maxdepth 3 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)
          if [ -z "$ACTUAL_DIR" ]; then
            echo "::error::Could not find settings.gradle or settings.gradle.kts in $PROJECT_DIR!"
            exit 1
          fi
          PROJECT_ROOT=$(dirname "$ACTUAL_DIR")

          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"
          echo "=== Resolved Android Project Root: $PROJECT_ROOT ==="

      - name: Verify and Fix Gradle Wrapper
        run: |
          set -euo pipefail
          PROJECT_ROOT="${{ steps.project_setup.outputs.project_root }}"
          cd "$PROJECT_ROOT"

          echo "=== Checking Gradle Wrapper in $PROJECT_ROOT ==="
          mkdir -p gradle/wrapper

          WRAPPER_JAR="gradle/wrapper/gradle-wrapper.jar"
          EXPECTED_SHA256="2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046"

          NEED_DOWNLOAD=false
          if [ ! -f "$WRAPPER_JAR" ]; then
            echo "WARNING: $WRAPPER_JAR is MISSING!"
            NEED_DOWNLOAD=true
          elif [ ! -s "$WRAPPER_JAR" ]; then
            echo "WARNING: $WRAPPER_JAR is 0 bytes (corrupted)!"
            NEED_DOWNLOAD=true
          else
            CURRENT_SHA256=$(sha256sum "$WRAPPER_JAR" | awk '{print $1}')
            echo "Found existing gradle-wrapper.jar (SHA-256: $CURRENT_SHA256)"
            if [ "$CURRENT_SHA256" != "$EXPECTED_SHA256" ]; then
              echo "Checksum does not match official Gradle 8.10.2 wrapper. Downloading official release..."
              NEED_DOWNLOAD=true
            fi
          fi

          if [ "$NEED_DOWNLOAD" = true ]; then
            echo "Downloading official Gradle 8.10.2 wrapper jar..."
            curl -sSL "https://raw.githubusercontent.com/gradle/gradle/v8.10.2/gradle/wrapper/gradle-wrapper.jar" -o "$WRAPPER_JAR"
            ACTUAL_SHA256=$(sha256sum "$WRAPPER_JAR" | awk '{print $1}')
            echo "Downloaded wrapper SHA-256: $ACTUAL_SHA256"
            if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
              echo "::error::Downloaded wrapper jar failed SHA-256 integrity verification!"
              exit 1
            fi
            echo "Official Gradle 8.10.2 wrapper jar successfully verified and installed."
          fi

          if [ ! -f "gradlew" ]; then
            echo "::error::gradlew script not found in $PROJECT_ROOT!"
            exit 1
          fi
          chmod +x gradlew
          echo "Gradle wrapper is fully verified and executable."

      - name: Validate Project Configuration
        run: |
          set -euo pipefail
          PROJECT_ROOT="${{ steps.project_setup.outputs.project_root }}"
          cd "$PROJECT_ROOT"

          echo "=== Validating Required Files ==="
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo "::error::Missing settings.gradle or settings.gradle.kts!"
            exit 1
          fi

          if [ ! -f "app/build.gradle.kts" ] && [ ! -f "app/build.gradle" ]; then
            echo "::error::Missing app/build.gradle or app/build.gradle.kts!"
            exit 1
          fi

          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            echo "::error::Missing app/src/main/AndroidManifest.xml!"
            exit 1
          fi

          echo "Core project structure verified successfully."

      - name: Build Debug APK
        run: |
          set -euo pipefail
          PROJECT_ROOT="${{ steps.project_setup.outputs.project_root }}"
          cd "$PROJECT_ROOT"

          echo "=== Starting Gradle Debug Build ==="
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK Output
        id: verify_apk
        run: |
          set -euo pipefail
          PROJECT_ROOT="${{ steps.project_setup.outputs.project_root }}"
          APK_PATH="$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Expected APK was not found at $APK_PATH!"
            echo "Contents of app/build/outputs:"
            find "$PROJECT_ROOT/app/build/outputs" || true
            exit 1
          fi

          echo "SUCCESS: Debug APK found!"
          ls -lh "$APK_PATH"
          sha256sum "$APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-assistant-debug-apk
          path: ${{ steps.verify_apk.outputs.apk_path }}
          retention-days: 14
