name: Build Android Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Locate or Extract Android Project
        id: project_setup
        run: |
          set -euo pipefail

          echo "=== Inspecting workspace structure ==="
          ls -la

          PROJECT_DIR="."

          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo "No settings.gradle(.kts) found in repository root. Searching for project ZIP archives..."

            ZIP_FILES=$(find . -maxdepth 3 -type f -name "*.zip" ! -path "*/.*")
            if [ -z "$ZIP_FILES" ]; then
              echo "::error::Neither settings.gradle(.kts) nor any project .zip file was found in the repository root!"
              exit 1
            fi

            echo "Found ZIP file(s):"
            echo "$ZIP_FILES"

            SELECTED_ZIP=""
            for z in $ZIP_FILES; do
              if unzip -l "$z" | grep -qE "settings\.gradle(\.kts)?"; then
                SELECTED_ZIP="$z"
                echo "Selected project archive: $SELECTED_ZIP"
                break
              fi
            done

            if [ -z "$SELECTED_ZIP" ]; then
              SELECTED_ZIP=$(echo "$ZIP_FILES" | head -n 1)
              echo "Fallback to first archive: $SELECTED_ZIP"
            fi

            mkdir -p extracted_project
            unzip -q -o "$SELECTED_ZIP" -d extracted_project
            PROJECT_DIR="extracted_project"

            NESTED_ZIPS=$(find extracted_project -maxdepth 2 -type f -name "*.zip" || true)
            if [ -n "$NESTED_ZIPS" ]; then
              for nz in $NESTED_ZIPS; do
                if unzip -l "$nz" | grep -qE "settings\.gradle(\.kts)?"; then
                  echo "Found nested project archive: $nz"
                  mkdir -p extracted_nested
                  unzip -q -o "$nz" -d extracted_nested
                  PROJECT_DIR="extracted_nested"
                  break
                fi
              done
            fi
          fi

          ACTUAL_DIR=$(find "$PROJECT_DIR" -maxdepth 5 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) ! -path "*/build/*" | head -n 1)
          if [ -z "$ACTUAL_DIR" ]; then
            echo "::error::Could not find settings.gradle or settings.gradle.kts in $PROJECT_DIR!"
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$ACTUAL_DIR")
          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"
          echo "=== Resolved Android Project Root: $PROJECT_ROOT ==="

      - name: Verify and Setup Gradle Wrapper
        run: |
          set -euo pipefail
          PROJECT_ROOT="${{ steps.project_setup.outputs.project_root }}"
          cd "$PROJECT_ROOT"

          echo "=== Verifying Gradle Wrapper in $PROJECT_ROOT ==="
          mkdir -p gradle/wrapper

          WRAPPER_JAR="gradle/wrapper/gradle-wrapper.jar"
          WRAPPER_PROPS="gradle/wrapper/gradle-wrapper.properties"

          if [ ! -f "$WRAPPER_JAR" ] || [ ! -s "$WRAPPER_JAR" ]; then
            GRADLE_VER="8.10.2"
            if [ -f "$WRAPPER_PROPS" ]; then
              DETECTED_VER=$(grep "distributionUrl" "$WRAPPER_PROPS" | grep -oE "gradle-[0-9]+\.[0-9]+(\.[0-9]+)?" | sed 's/gradle-//' || true)
              if [ -n "$DETECTED_VER" ]; then
                GRADLE_VER="$DETECTED_VER"
              fi
            fi
            echo "Downloading official gradle-wrapper.jar for Gradle $GRADLE_VER..."
            curl -sSL "https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VER}/gradle/wrapper/gradle-wrapper.jar" -o "$WRAPPER_JAR" || \
            curl -sSL "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip" -o /tmp/gradle-dist.zip && \
            unzip -q -j /tmp/gradle-dist.zip "*/lib/plugins/gradle-wrapper-*.jar" -d /tmp/wrapper_tmp && \
            mv /tmp/wrapper_tmp/gradle-wrapper-*.jar "$WRAPPER_JAR" || true
          fi

          if [ ! -f "gradlew" ]; then
            echo "::error::gradlew script not found in $PROJECT_ROOT!"
            exit 1
          fi

          chmod +x gradlew
          echo "Gradle wrapper ready."

      - name: Validate Project Configuration
        run: |
          set -euo pipefail
          PROJECT_ROOT="${{ steps.project_setup.outputs.project_root }}"
          cd "$PROJECT_ROOT"

          echo "=== Validating Required Project Files ==="
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo "::error::Missing settings.gradle or settings.gradle.kts!"
            exit 1
          fi

          if [ ! -f "app/build.gradle.kts" ] && [ ! -f "app/build.gradle" ]; then
            echo "::error::Missing app/build.gradle or app/build.gradle.kts!"
            exit 1
          fi

          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            echo "::error::Missing app/src/main/AndroidManifest.xml!"
            exit 1
          fi

          echo "Core project structure verified."

      - name: Run Android Unit Tests
        run: |
          set -euo pipefail
          PROJECT_ROOT="${{ steps.project_setup.outputs.project_root }}"
          cd "$PROJECT_ROOT"

          echo "=== Running Android Unit Tests ==="
          ./gradlew test --stacktrace --no-daemon

      - name: Build Debug APK
        run: |
          set -euo pipefail
          PROJECT_ROOT="${{ steps.project_setup.outputs.project_root }}"
          cd "$PROJECT_ROOT"

          echo "=== Starting Gradle Debug Build ==="
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK Output & Calculate Checksum
        id: verify_apk
        run: |
          set -euo pipefail
          PROJECT_ROOT="${{ steps.project_setup.outputs.project_root }}"

          APK_PATH=$(find "$PROJECT_ROOT/app/build/outputs/apk/debug" -maxdepth 2 -type f -name "*.apk" | head -n 1)

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::Expected APK was not found under $PROJECT_ROOT/app/build/outputs/apk/debug!"
            echo "Contents of app/build/outputs:"
            find "$PROJECT_ROOT/app/build/outputs" || true
            exit 1
          fi

          echo "SUCCESS: Debug APK found!"
          ls -lh "$APK_PATH"
          echo "SHA-256 Checksum:"
          sha256sum "$APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-assistant-debug-apk
          path: ${{ steps.verify_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
