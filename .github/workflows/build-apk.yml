
name: Build Android Debug APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "latest"

      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Locate Android Project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f settings.gradle.kts || -f settings.gradle ]]; then
            echo "root=." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p "$RUNNER_TEMP/nova-hub" "$RUNNER_TEMP/nova-project"

          mapfile -d '' archives < <(
            find "$GITHUB_WORKSPACE" -maxdepth 1 \
              -type f -name '*.zip' -print0
          )

          if [[ ${#archives[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one ZIP at repository root."
            printf '%s\n' "${archives[@]}"
            exit 1
          fi

          unzip -oq "${archives[0]}" -d "$RUNNER_TEMP/nova-hub"

          INNER="$RUNNER_TEMP/nova-hub/public/downloads/nova-android-project-ready.zip"

          if [[ ! -f "$INNER" ]]; then
            echo "::error::Expected Android project ZIP was not found."
            find "$RUNNER_TEMP/nova-hub" -type f -name '*.zip' -print
            exit 1
          fi

          unzip -oq "$INNER" -d "$RUNNER_TEMP/nova-project"

          SETTINGS="$(find "$RUNNER_TEMP/nova-project" \
            -maxdepth 5 -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)"

          if [[ -z "$SETTINGS" ]]; then
            echo "::error::No Gradle settings file in Android ZIP."
            find "$RUNNER_TEMP/nova-project" -maxdepth 5 -type f | head -100
            exit 1
          fi

          ROOT="$(dirname "$SETTINGS")"

          if [[ ! -f "$ROOT/gradlew" ]]; then
            echo "::error::Gradle wrapper is missing."
            exit 1
          fi

          if [[ ! -f "$ROOT/app/build.gradle.kts" && \
                ! -f "$ROOT/app/build.gradle" ]]; then
            echo "::error::Android app Gradle file is missing."
            exit 1
          fi

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Android project found: $ROOT"

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.root }}"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="${{ steps.project.outputs.root }}/app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -s "$APK" ]]; then
            echo "::error::APK was not created."
            exit 1
          fi

          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-assistant-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
          
