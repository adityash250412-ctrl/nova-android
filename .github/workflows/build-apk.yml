
name: Build NOVA APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install required Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nova"
          ZIP_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name "*.zip" -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No ZIP file found in repository root."
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/nova"

          PROJECT_DIR=$(find "$RUNNER_TEMP/nova" -type f -name gradlew -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            INNER_ZIP=$(find "$RUNNER_TEMP/nova" -type f -name "*.zip" -print -quit)
            if [ -n "$INNER_ZIP" ]; then
              mkdir -p "$RUNNER_TEMP/nova-inner"
              unzip -q "$INNER_ZIP" -d "$RUNNER_TEMP/nova-inner"
              PROJECT_DIR=$(find "$RUNNER_TEMP/nova-inner" -type f -name gradlew -print -quit | xargs -r dirname)
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Could not find gradlew in the ZIP files."
            find "$RUNNER_TEMP/nova" -maxdepth 3 -type f | head -80
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find "$PROJECT_DIR" -type f -path "*/build/outputs/apk/*/*.apk" -print -quit)
          if [ -z "$APK" ]; then
            echo "::error::Build finished but no APK was found."
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$APK" "$GITHUB_WORKSPACE/apk-output/NOVA-debug.apk"
          echo "APK copied successfully."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-debug-APK
          path: apk-output/NOVA-debug.apk
          if-no-files-found: error
