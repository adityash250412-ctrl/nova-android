name: Build NOVA APK from ZIP

on:
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Install unzip
    run: sudo apt-get update && sudo apt-get install -y unzip

  - name: Extract uploaded project ZIP
    shell: bash
    run: |
      set -e
      ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*nova*project*ready*.zip' -print -quit)"
      if [ -z "$ZIP_FILE" ]; then
        echo "Project ZIP not found in repository root."
        echo "Upload nova-android-project-ready.zip first."
        exit 1
      fi
      mkdir extracted
      unzip -q "$ZIP_FILE" -d extracted
      WRAPPER="$(find extracted -type f -name gradlew -print -quit)"
      if [ -z "$WRAPPER" ]; then
        echo "gradlew not found inside ZIP."
        find extracted -maxdepth 3 -type f | head -100
        exit 1
      fi
      echo "PROJECT_DIR=$(dirname "$WRAPPER")" >> "$GITHUB_ENV"

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Build debug APK
    shell: bash
    run: |
      set -e
      sdkmanager "platforms;android-35" "build-tools;35.0.0"
      cd "$PROJECT_DIR"
      chmod +x gradlew
      ./gradlew assembleDebug --stacktrace --no-daemon

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: nova-assistant-debug-apk
      path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 14
