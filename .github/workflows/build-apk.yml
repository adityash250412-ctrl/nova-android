
name: Build NOVA APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/nova-unpack
          ZIP_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found in repository root."
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d /tmp/nova-unpack
          PROJECT_DIR=$(find /tmp/nova-unpack -type f -name gradlew -print -quit | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            NESTED_ZIP=$(find /tmp/nova-unpack -type f -name "*.zip" -print -quit)
            if [ -n "$NESTED_ZIP" ]; then
              mkdir -p /tmp/nova-project
              unzip -q "$NESTED_ZIP" -d /tmp/nova-project
              PROJECT_DIR=$(find /tmp/nova-project -type f -name gradlew -print -quit | xargs -r dirname)
            fi
          fi
          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not find Gradle wrapper (gradlew) inside ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          chmod +x "$PROJECT_DIR/gradlew"
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-debug-APK
          path: /tmp/nova-unpack/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
